
openapi: 3.0.3

info:
  title: Addition Service API
  version: 1.0.0

paths:
  /ms1/add:
    get:
      summary: Add two numbers

      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: integer

        - name: b
          in: query
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Successful addition
          content:
            text/plain:
              schema:
                type: string
              example: "Addition is: 15"
